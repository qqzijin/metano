[project]
name = "metano"
version = "0.1.0"
description = "AI gateway bridge with evolution engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
voice = [
    "openai-whisper>=20231117",
    "pyttsx4>=3.0",
]
search = [
    "duckduckgo-search>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
